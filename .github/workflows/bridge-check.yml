name: Bridge server checks

on:
  push:
    branches: ["**"]
    paths:
      - "bridge/**"
      - "render.yaml"
      - ".github/workflows/bridge-check.yml"
  pull_request:
    paths:
      - "bridge/**"
      - "render.yaml"
      - ".github/workflows/bridge-check.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Check server syntax
        run: node --check bridge/server.js
      - name: Check package metadata
        run: node -e "const p=require('./bridge/package.json'); if(p.engines.node !== '>=24') process.exit(1)"
