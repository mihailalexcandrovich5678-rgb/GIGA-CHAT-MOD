openapi: 3.1.0
info:
  title: Geode Bridge Relay
  version: 0.2.0
  description: Authenticated relay API. This schema is for a separately configured assistant Action, not an automatic connection to an ordinary ChatGPT chat.
servers:
  - url: https://YOUR-BRIDGE-HOST
paths:
  /health:
    get:
      operationId: health
      security: []
      responses:
        "200":
          description: Service health
  /v1/pair/start:
    post:
      operationId: startDevicePairing
      summary: Create a short-lived pairing code (owner-only)
      security:
        - pairingAdmin: []
      responses:
        "201":
          description: One-time pairing code
        "401":
          description: Invalid pairing administrator token
        "429":
          description: Pairing rate limit reached
  /v1/pair/claim:
    post:
      operationId: claimDevicePairing
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  pattern: '^[0-9]{6}$'
      responses:
        "201":
          description: Device token (shown once)
        "401":
          description: Invalid or expired code
        "429":
          description: Pairing rate limit reached
  /v1/assistant/commands:
    post:
      operationId: enqueueGameCommand
      summary: Queue a supported command for a paired Geometry Dash device
      security:
        - assistantBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device_id, kind]
              properties:
                device_id:
                  type: string
                kind:
                  type: string
                  enum: [bridge.ping, editor.get_status]
      responses:
        "202":
          description: Command queued
        "401":
          description: Invalid assistant bearer token
        "400":
          description: Command is not enabled
components:
  securitySchemes:
    assistantBearer:
      type: http
      scheme: bearer
    pairingAdmin:
      type: http
      scheme: bearer
